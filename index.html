<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Svesse's Local AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  :root {
    --void-1: #05060a;
    --void-2: #0a0e18;
    --text: #eef1f8;
    --text-dim: rgba(238, 241, 248, 0.5);
    --text-faint: rgba(238, 241, 248, 0.28);
    --accent: #7dd8ff;
    --accent-dim: rgba(125, 216, 255, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--void-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: var(--text);
  }

  /* — deep space backdrop: gradient + drifting nebula glow, stars on canvas.
     z-index stays >= 0 throughout: a `position:fixed` + negative z-index
     layer is a classic trap — it paints *behind* the body's own background
     (which gets promoted to the page canvas) in every browser, not in front
     of it, so it would never be visible no matter how bright it is. Instead
     the background layers sit at z-index 0 and the stage/HUD are lifted to
     1/2 so normal stacking keeps them on top. — */
  .space {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 36%, #1a2a45 0%, transparent 62%),
      radial-gradient(ellipse 120% 90% at 50% 100%, var(--void-2) 0%, var(--void-1) 55%);
  }
  .nebula {
    position: fixed; inset: -10%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 26% 30%, rgba(104, 150, 255, 0.28), transparent 34%),
      radial-gradient(circle at 74% 64%, rgba(140, 225, 255, 0.22), transparent 32%),
      radial-gradient(circle at 50% 85%, rgba(180, 120, 255, 0.14), transparent 30%);
    filter: blur(50px) hue-rotate(0deg);
    animation: drift 34s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(-1.5%, -1%, 0) scale(1); filter: blur(50px) hue-rotate(0deg); }
    50%  { transform: translate3d(1%, 1%, 0) scale(1.04); filter: blur(50px) hue-rotate(16deg); }
    100% { transform: translate3d(1.5%, 1.5%, 0) scale(1.05); filter: blur(50px) hue-rotate(-10deg); }
  }
  /* a second, slower nebula layer on its own period and a different pair of
     hotspots — two independent drifts read as atmosphere; one drift reads
     as a single thing wobbling */
  .nebula-b {
    position: fixed; inset: -14%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 66% 22%, rgba(255, 143, 208, 0.16), transparent 30%),
      radial-gradient(circle at 20% 78%, rgba(124, 255, 178, 0.12), transparent 28%);
    filter: blur(64px);
    animation: drift-b 52s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }
  @keyframes drift-b {
    0%   { transform: translate3d(1.5%, 1%, 0) scale(1.02) rotate(0deg); }
    50%  { transform: translate3d(-1%, -1.5%, 0) scale(1.06) rotate(2deg); }
    100% { transform: translate3d(-1.8%, 0.5%, 0) scale(1) rotate(-1.5deg); }
  }
  #stars { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }

  /* soft ambient bounce-light behind the die, tying its silhouette to the
     nebula colors around it instead of sitting on the backdrop like a cutout.
     A slow breathing pulse keeps it from reading as a static painted disc. */
  .die-glow {
    position: fixed; top: 54%; left: 50%; z-index: 0; pointer-events: none;
    width: 62vmin; height: 62vmin; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(110, 180, 255, 0.16) 0%, rgba(90, 140, 255, 0.06) 40%, transparent 70%);
    animation: glow-breathe 8s ease-in-out infinite;
  }
  @keyframes glow-breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
    50%      { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula, .nebula-b, .die-glow { animation: none; }
  }

  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; position: relative; z-index: 1; width: 100vw; height: 100vh; }

  .hud { position: fixed; z-index: 2; pointer-events: none; }
  .hud a, .hud button { pointer-events: auto; }

  .brand {
    top: var(--edge, 28px); left: var(--edge, 28px);
  }
  .brand .brand-row {
    display: flex; align-items: center; gap: 10px;
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 10px 1px var(--accent-dim);
  }
  .brand .label {
    font-size: 13px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--text);
  }
  /* the site's sections, as a proper top-center banner — the die is home,
     everything else hangs off it, but that still deserves a real nav bar
     rather than a couple of quiet text links */
  .nav-banner {
    top: var(--edge, 28px); left: 50%; transform: translateX(-50%);
    display: inline-flex; gap: 4px;
    background: rgba(11, 20, 33, 0.6);
    border: 1px solid rgba(125, 216, 255, 0.22);
    border-radius: 999px;
    padding: 5px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  }
  .nav-banner a {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    color: var(--text-dim); text-decoration: none;
    padding: 8px 18px;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-banner a:hover, .nav-banner a:focus-visible {
    background: rgba(125, 216, 255, 0.16);
    color: var(--text);
  }

  .specs {
    top: var(--edge, 28px); right: var(--edge, 28px);
    text-align: right; font-size: 11px; letter-spacing: 0.08em;
    color: var(--text-dim); line-height: 1.9;
  }
  .specs b { color: var(--text); font-weight: 600; }

  @media (max-width: 640px) {
    .specs { display: none; }
    .brand { top: 18px; left: 18px; }
    .nav-banner { top: auto; bottom: 18px; padding: 4px; }
    .nav-banner a { padding: 8px 12px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="space"></div>
<div class="nebula"></div>
<div class="nebula-b"></div>
<canvas id="stars"></canvas>
<div class="die-glow"></div>

<div class="hud brand">
  <div class="brand-row">
    <span class="dot"></span>
    <span class="label">Svesse's Local AI</span>
  </div>
</div>

<nav class="hud nav-banner">
  <a href="get-started.html">Get Started</a>
  <a href="inventory.html">Inventory</a>
  <a href="model-heretic.html">Heretic Model</a>
  <a href="localai-hub.html">LocalAI Hub</a>

<div class="hud specs">
  <div><b>240mm</b> edge</div>
  <div><b>12mm</b> fillet</div>
  <div><b>Ink resin</b></div>
</div>

<three-d-stage name="ai-model-die" background="transparent"></three-d-stage>

<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

/* ---- dimensions (meters) ---- */
const S = 0.24;            // basketball-scale cube edge
const H = S / 2;
const BEV = 0.012;         // edge fillet
const CORE = S - 2 * BEV;  // ExtrudeGeometry's bevel grows the section outward by BEV
const CORNER = 0.004;      // vertical-edge radius = CORNER + BEV

/* ---- materials ---- */
/* a lacquered-resin finish: a physical material with its own clearcoat
   layer gives a wet-look gloss on top of the base color, distinct from the
   base roughness — the die reads as cast resin under a hard finish coat,
   not a flat plastic cube. */
const resin = new THREE.MeshPhysicalMaterial({
  name: 'ink-resin', color: 0x23211f,
  roughness: 0.38, metalness: 0.08,
  clearcoat: 1, clearcoatRoughness: 0.12,
});

/* ---- shape helpers ---- */
function roundedSquare(size, r) {
  const h = size / 2, s = new THREE.Shape();
  s.moveTo(-h + r, -h);
  s.lineTo(h - r, -h);
  s.absarc(h - r, -h + r, r, -Math.PI / 2, 0, false);
  s.lineTo(h, h - r);
  s.absarc(h - r, h - r, r, 0, Math.PI / 2, false);
  s.lineTo(-h + r, h);
  s.absarc(-h + r, h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-h, -h + r);
  s.absarc(-h + r, -h + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
/* ---- body ---- */
const die = new THREE.Group();
die.name = 'ai-model-die';

const bodyGeo = new THREE.ExtrudeGeometry(roundedSquare(CORE, CORNER), {
  depth: CORE, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV,
  bevelOffset: 0, bevelSegments: 10, curveSegments: 16, steps: 1
});
bodyGeo.translate(0, 0, -CORE / 2);
const body = new THREE.Mesh(bodyGeo, resin);
body.name = 'die-body';
body.castShadow = body.receiveShadow = true;
die.add(body);

/* ---- face labels: one local Ollama-servable model per face, each a
   clickable button that opens the local Ollama instance. Each face carries
   its own accent hue (drawn from colors already used elsewhere on the site
   — nebula blue/violet, the "ok"/"warn" tones from the inventory page) so
   the six buttons read as six distinct things at a glance, not one button
   repeated six times. ---- */
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgba(hex, a) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

/* fixed warning amber, independent of each face's own accent — matches the
   "Uncensored / No Filter / NSFW" tag styling used on the Heretic model
   page and its inventory tab, so the same content-nature warning reads the
   same color everywhere on the site. */
const WARN_COLOR = '#ffb454';

function makeLabelTexture(modelName, hover, subtitle, accent, tags, info, tagColor) {
  tagColor = tagColor || accent;
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  const title = modelName.toUpperCase();
  const titleFont = 84, captionFont = 25;
  const ruleGap = 22, ruleH = 4, captionGap = 22;
  const subtitleFont = 22, subtitleGap = 10;
  const tagsFont = 15, tagChipH = tagsFont + 14, tagsGapAbove = 16, tagsGapBelow = 18;
  const infoFont = 15, infoGapAbove = 10, infoGapBelow = 4;

  const contentH = titleFont
    + (subtitle ? subtitleFont + subtitleGap : 0)
    + (tags && tags.length ? tagsGapAbove + tagChipH + tagsGapBelow : 0)
    + (info ? infoGapAbove + infoFont + infoGapBelow : 0)
    + ruleGap + ruleH + captionGap + captionFont;
  const padX = 56, padY = 40;
  const plateW = Math.min(size - padX, 460);
  const plateH = contentH + padY * 2;
  const plateX = (size - plateW) / 2;
  const plateY = (size - plateH) / 2;
  const radius = 26;

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* glowing vine tendrils growing out of each corner, into the margin
     around the button plate — a decorative flourish drawn straight into
     this same texture (rather than a separate mesh) so there's no UV
     mapping to fight on the extruded die body; every face gets its own
     color since it uses that face's own accent. Randomized per tendril
     (count, length, curve, branches, buds) so the four corners never
     mirror each other — it should read as grown, not stamped. */
  function drawTendril(x, y, dx, dy, len, curveJitter, widthScale) {
    const endX = x + dx * len;
    const endY = y + dy * len;
    const bulge = (Math.random() * 0.5 + 0.3) * curveJitter;
    const midX = x + dx * len * (0.4 + Math.random() * 0.3) + dy * bulge;
    const midY = y + dy * len * (0.4 + Math.random() * 0.3) - dx * bulge;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(midX, midY, endX, endY);
    ctx.lineWidth = (hover ? 2.6 : 2.1) * widthScale;
    ctx.strokeStyle = rgba(accent, hover ? 0.7 : 0.5);
    ctx.shadowColor = rgba(accent, 0.9);
    ctx.shadowBlur = hover ? 13 : 9;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // zero, one or two offshoot branches at random points along the tendril
    const branchCount = Math.floor(Math.random() * 3);
    for (let b = 0; b < branchCount; b++) {
      const t = 0.3 + Math.random() * 0.5;
      const bx = x + dx * len * t;
      const by = y + dy * len * t;
      const side = Math.random() < 0.5 ? 1 : -1;
      const blen = len * (0.25 + Math.random() * 0.3);
      const bex = bx + dy * side * blen;
      const bey = by - dx * side * blen;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo((bx + bex) / 2, (by + bey) / 2 - side * 10, bex, bey);
      ctx.lineWidth = (hover ? 1.8 : 1.5) * widthScale;
      ctx.stroke();

      // a bud at the tip of the branch
      ctx.beginPath();
      ctx.fillStyle = rgba(accent, hover ? 0.95 : 0.75);
      ctx.shadowColor = rgba(accent, 1);
      ctx.shadowBlur = hover ? 12 : 8;
      ctx.arc(bex, bey, 2.6 + Math.random() * 1.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // a random scatter of luminous buds along the main tendril itself
    const budCount = 2 + Math.floor(Math.random() * 3);
    for (let k = 0; k < budCount; k++) {
      const t = 0.2 + Math.random() * 0.75;
      const px = x + dx * len * t;
      const py = y + dy * len * t;
      ctx.beginPath();
      ctx.fillStyle = rgba(accent, hover ? 0.95 : 0.75);
      ctx.shadowColor = rgba(accent, 1);
      ctx.shadowBlur = hover ? 12 : 8;
      ctx.arc(px, py, 2.4 + Math.random() * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawVines() {
    const corners = [
      { x: 22, y: 22, dx: 1, dy: 1 },
      { x: size - 22, y: 22, dx: -1, dy: 1 },
      { x: 22, y: size - 22, dx: 1, dy: -1 },
      { x: size - 22, y: size - 22, dx: -1, dy: -1 },
    ];
    corners.forEach(({ x, y, dx, dy }) => {
      // one to three tendrils per corner, each with its own random angle
      // spread away from the pure diagonal so they fan out unevenly
      const tendrilCount = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < tendrilCount; i++) {
        const spread = (Math.random() - 0.5) * 0.7;
        const tdx = dx + spread * dy;
        const tdy = dy - spread * dx;
        const mag = Math.hypot(tdx, tdy);
        const len = 60 + Math.random() * 90;
        drawTendril(x, y, tdx / mag, tdy / mag, len, 40, 0.75 + Math.random() * 0.5);
      }
    });
  }
  drawVines();

  /* button plate: filled + glowing, brighter border and fill on hover.
     Blur radii run bigger across the board than a typical UI glow — this
     is a die face meant to read from an orbiting camera, not a form
     control, so it earns a more theatrical amount of light. */
  roundRect(plateX, plateY, plateW, plateH, radius);
  ctx.fillStyle = hover ? 'rgba(20, 28, 40, 0.82)' : 'rgba(11, 20, 33, 0.5)';
  ctx.shadowColor = hover ? rgba(accent, 1) : rgba(accent, 0.55);
  ctx.shadowBlur = hover ? 48 : 22;
  ctx.fill();
  ctx.shadowBlur = 0;

  /* a soft radial spotlight behind the title, plus the diagonal
     sheen — together they read as "lit from inside," not just outlined */
  ctx.save();
  roundRect(plateX, plateY, plateW, plateH, radius);
  ctx.clip();
  const spot = ctx.createRadialGradient(
    size / 2, plateY + padY + 60, 10,
    size / 2, plateY + padY + 60, plateW * 0.55
  );
  spot.addColorStop(0, rgba(accent, hover ? 0.32 : 0.2));
  spot.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  const sheen = ctx.createLinearGradient(plateX, plateY, plateX + plateW * 0.4, plateY + plateH);
  sheen.addColorStop(0, rgba(accent, hover ? 0.24 : 0.13));
  sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.restore();

  roundRect(plateX, plateY, plateW, plateH, radius);
  ctx.lineWidth = hover ? 4 : 2.5;
  ctx.strokeStyle = hover ? rgba(accent, 1) : rgba(accent, 0.75);
  ctx.stroke();

  let cursorY = plateY + padY;

  /* model name: layered glow, then a crisp core pass on top */
  ctx.font = '800 ' + titleFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  [40, 24, 12].forEach((blur) => {
    ctx.shadowColor = rgba(accent, 0.9);
    ctx.shadowBlur = hover ? blur * 1.35 : blur;
    ctx.fillStyle = '#f4fbff';
    ctx.fillText(title, size / 2, cursorY);
  });
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(title, size / 2, cursorY);
  cursorY += titleFont;

  /* optional subtitle — used where the model name alone doesn't say enough
     (e.g. a variant's base model + size) but the full name is too long to
     set as the title itself */
  if (subtitle) {
    cursorY += subtitleGap;
    ctx.font = '600 ' + subtitleFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
    try { ctx.letterSpacing = '1px'; } catch (e) {}
    ctx.fillStyle = rgba(accent, 0.8);
    ctx.fillText(subtitle.toUpperCase(), size / 2, cursorY);
    cursorY += subtitleFont;
  }

  /* content-nature tag chips (Uncensored / No Filter / NSFW, etc.) — same
     warning amber and pill shape as the tags on the Heretic model page, so
     the warning reads consistently whether you're looking at the die or
     the write-up */
  if (tags && tags.length) {
    cursorY += tagsGapAbove;
    ctx.font = '700 ' + tagsFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
    try { ctx.letterSpacing = '1.5px'; } catch (e) {}
    const chipPadX = 14, chipGap = 8;
    const widths = tags.map((t) => ctx.measureText(t).width);
    const totalW = widths.reduce((a, w) => a + w + chipPadX * 2, 0) + chipGap * (tags.length - 1);
    let chipX = size / 2 - totalW / 2;
    for (let i = 0; i < tags.length; i++) {
      const w = widths[i] + chipPadX * 2;
      roundRect(chipX, cursorY, w, tagChipH, tagChipH / 2);
      ctx.fillStyle = rgba(tagColor, 0.18);
      ctx.shadowColor = rgba(tagColor, 0.6);
      ctx.shadowBlur = hover ? 14 : 8;
      ctx.fill();
      ctx.shadowBlur = 0;
      roundRect(chipX, cursorY, w, tagChipH, tagChipH / 2);
      ctx.strokeStyle = rgba(tagColor, 0.6);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = tagColor;
      ctx.fillText(tags[i], chipX + w / 2, cursorY + (tagChipH - tagsFont) / 2 - 1);
      chipX += w + chipGap;
    }
    cursorY += tagChipH + tagsGapBelow;
  }

  /* one extra line of practical detail — download size, RAM, whatever
     matters most for the specific model, kept short enough to read at
     die scale */
  if (info) {
    cursorY += infoGapAbove;
    ctx.font = '600 ' + infoFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
    try { ctx.letterSpacing = '0.5px'; } catch (e) {}
    ctx.fillStyle = 'rgba(238, 241, 248, 0.55)';
    ctx.fillText(info, size / 2, cursorY);
    cursorY += infoFont + infoGapBelow;
  }

  cursorY += ruleGap;

  /* accent rule — a bit wider and brighter than a hairline divider */
  const ruleWidth = plateW * 0.34;
  ctx.shadowColor = rgba(accent, 0.85);
  ctx.shadowBlur = hover ? 22 : 16;
  ctx.fillStyle = rgba(accent, 1);
  ctx.fillRect(size / 2 - ruleWidth / 2, cursorY, ruleWidth, ruleH);
  ctx.shadowBlur = 0;
  cursorY += ruleH + captionGap;

  /* explicit button affordance, brighter on hover */
  ctx.font = '700 ' + captionFont + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif';
  try { ctx.letterSpacing = '3px'; } catch (e) {}
  ctx.fillStyle = hover ? '#f4fbff' : rgba(accent, 0.8);
  ctx.fillText('TAP TO OPEN ↗', size / 2, cursorY);

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* explicit per-face (right, up, normal) basis keeps every label upright and
   unmirrored — deriving it from a single lookAt/quaternion flip is ambiguous
   for the three antiparallel face pairs (±X, ±Y, ±Z). */
function faceQuaternion(normal, up) {
  const n = new THREE.Vector3(...normal);
  const right = new THREE.Vector3().crossVectors(up, n).normalize();
  const trueUp = new THREE.Vector3().crossVectors(n, right).normalize();
  const m = new THREE.Matrix4().makeBasis(right, trueUp, n);
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

/* one open-weight model per face — opposite faces sum to seven, same
   arrangement as a standard d6. Each carries its own accent hue, pulled
   from colors already in play elsewhere on the site (the nebula's blue and
   violet, the inventory page's "ok" green, Heretic's warning red) so the
   palette feels like one family instead of six arbitrary colors. */
const FACES = [
  {
    normal: [0, 0, 1], up: new THREE.Vector3(0, 1, 0), model: 'Llama', accent: '#ffb454',
    tags: ['META', 'OPEN WEIGHTS', 'GENERAL'],
    info: 'General-purpose chat & instruct',
  },
  {
    normal: [0, 0, -1], up: new THREE.Vector3(0, 1, 0), model: 'DeepSeek', accent: '#6896ff',
    tags: ['OPEN WEIGHTS', 'REASONING', 'CODING'],
    info: 'Strong at reasoning & code',
  },
  {
    normal: [1, 0, 0], up: new THREE.Vector3(0, 1, 0), model: 'Mistral', accent: '#b478ff',
    tags: ['MISTRAL AI', 'OPEN WEIGHTS', 'FAST'],
    info: 'Efficient & multilingual',
  },
  {
    normal: [-1, 0, 0], up: new THREE.Vector3(0, 1, 0), model: 'Phi', accent: '#ff8fd0',
    tags: ['MICROSOFT', 'SMALL', 'ON-DEVICE'],
    info: 'Compact — light on hardware',
  },
  {
    normal: [0, 1, 0], up: new THREE.Vector3(0, 0, -1), model: 'Gemma', accent: '#7cffb2',
    tags: ['GOOGLE', 'OPEN WEIGHTS', 'LIGHTWEIGHT'],
    info: 'Efficient, multiple sizes',
  },
  {
    normal: [0, -1, 0], up: new THREE.Vector3(0, 0, 1), model: 'Heretic',
    subtitle: 'Qwen 27B · Q8_0', accent: '#ff6c6c',
    tags: ['UNCENSORED', 'NO FILTER', 'NSFW'],
    info: '~29GB · 32GB+ RAM · NO REFUSALS',
    tagColor: WARN_COLOR,
  },
];

const LABEL_SIZE = S * 0.62;      // clears the 12mm edge fillet with margin to spare
const LABEL_OFFSET = H + 0.0008;  // tiny standoff so the plane never z-fights the resin
const labelMeshes = [];

for (const { normal, up, model, subtitle, accent, tags, info, tagColor } of FACES) {
  const mat = new THREE.MeshBasicMaterial({
    name: 'label-' + model.toLowerCase(),
    map: makeLabelTexture(model, false, subtitle, accent, tags, info, tagColor),
    transparent: true,
    depthWrite: false,
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(LABEL_SIZE, LABEL_SIZE), mat);
  plane.name = 'label-' + model.toLowerCase();
  plane.position.set(...normal).multiplyScalar(LABEL_OFFSET);
  plane.quaternion.copy(faceQuaternion(normal, up));
  plane.userData.normalTex = mat.map;
  plane.userData.hoverTex = makeLabelTexture(model, true, subtitle, accent, tags, info, tagColor);
  plane.userData.scaleTarget = 1;
  die.add(plane);
  labelMeshes.push(plane);
}

/* rest the die flat on the ground plane */
die.position.y = H;
stage.setObject(die);

/* ---- environment: a small procedural gradient so the resin's sheen picks
   up the scene's own blues/cyans instead of rendering flat black — the
   stage ships with no environment map by default (see its usage notes),
   so a bare cube here would look like a cutout pasted over the starfield
   instead of an object actually sitting in it. ---- */
function makeEnvironmentTexture() {
  const w = 256, h = 128;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#25344f');
  sky.addColorStop(0.45, '#101a2c');
  sky.addColorStop(1, '#05060a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  [
    { x: 0.18, y: 0.35, r: 46, c: 'rgba(104, 150, 255, 0.55)' },
    { x: 0.62, y: 0.55, r: 40, c: 'rgba(140, 225, 255, 0.45)' },
    { x: 0.85, y: 0.28, r: 30, c: 'rgba(180, 120, 255, 0.35)' },
  ].forEach(({ x, y, r, c }) => {
    const g = ctx.createRadialGradient(x * w, y * h, 0, x * w, y * h, r);
    g.addColorStop(0, c);
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });

  for (let i = 0; i < 50; i++) {
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (Math.random() * 0.5 + 0.3).toFixed(2) + ')';
    ctx.fillRect(Math.random() * w, Math.random() * h * 0.7, 1, 1);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(stage._renderer);
const envTex = makeEnvironmentTexture();
const envRT = pmrem.fromEquirectangular(envTex);
stage._scene.environment = envRT.texture;
envTex.dispose();
pmrem.dispose();

/* a cool point light echoing the nebula's blue, so one edge of the die
   catches a rim of ambient color instead of falling flat black */
const rim = new THREE.PointLight(0x6fb8ff, 2.2, 4, 2);
rim.position.set(-0.55, 0.5, -0.65);
stage._scene.add(rim);

/* ---- each face label is a real button: hover glow + click opens the
   local Ollama instance. Click is distinguished from an orbit drag by
   movement distance and elapsed time, not just click-vs-drag events,
   since OrbitControls listens on the same canvas for the same gestures. */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const canvasEl = stage._renderer.domElement;
let hoveredLabel = null;
let pointerDown = null;

function pickLabel(evt) {
  const rect = canvasEl.getBoundingClientRect();
  pointerNDC.x = ((evt.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((evt.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, stage._camera);
  const hits = raycaster.intersectObjects(labelMeshes, false);
  return hits.length ? hits[0].object : null;
}

canvasEl.addEventListener('pointermove', (evt) => {
  const hit = pickLabel(evt);
  if (hit !== hoveredLabel) {
    if (hoveredLabel) {
      hoveredLabel.material.map = hoveredLabel.userData.normalTex;
      hoveredLabel.material.needsUpdate = true;
      hoveredLabel.userData.scaleTarget = 1;
    }
    hoveredLabel = hit;
    if (hoveredLabel) {
      hoveredLabel.material.map = hoveredLabel.userData.hoverTex;
      hoveredLabel.material.needsUpdate = true;
      hoveredLabel.userData.scaleTarget = 1.09;
    }
  }
  canvasEl.style.cursor = hit ? 'pointer' : '';
});

canvasEl.addEventListener('pointerdown', (evt) => {
  pointerDown = { x: evt.clientX, y: evt.clientY, t: performance.now() };
});

canvasEl.addEventListener('pointerup', (evt) => {
  if (!pointerDown) return;
  const moved = Math.hypot(evt.clientX - pointerDown.x, evt.clientY - pointerDown.y);
  const elapsed = performance.now() - pointerDown.t;
  pointerDown = null;
  if (moved < 6 && elapsed < 500 && pickLabel(evt)) {
    window.open('http://localhost:11434', '_blank', 'noopener');
  }
});

/* ---- idle turntable spin + hover-lift, both driven by real elapsed time
   instead of a fixed per-frame step. three.js's own OrbitControls.autoRotate
   assumes 60 calls/sec and adds the same fixed angle on every call — so on
   a 75Hz/120Hz display it doesn't get smoother, it gets faster, since the
   same-size step now happens more often per second. Rotating the die group
   itself by (radians/sec * real dt) instead gives identical speed and
   genuinely smoother motion at any refresh rate. Stops on first manual
   drag, same as the old autoRotate behavior did. ---- */
const SPIN_SPEED = (2 * Math.PI / 60) * 1.2; // ~one revolution per 50s, matching the old autoRotateSpeed=1.2 feel
let autoSpin = true;
stage._controls.addEventListener('start', () => { autoSpin = false; });

let lastFrameT = performance.now();
function animate(t) {
  const dt = Math.min((t - lastFrameT) / 1000, 0.05); // clamp so a backgrounded tab doesn't jump-spin on return
  lastFrameT = t;

  if (autoSpin) die.rotation.y += SPIN_SPEED * dt;

  /* exponential smoothing toward each label's target scale — frame-rate
     independent, unlike a fixed per-frame lerp factor would be */
  const smoothing = 1 - Math.exp(-dt * 14);
  for (const plane of labelMeshes) {
    const target = plane.userData.scaleTarget;
    const current = plane.scale.x;
    if (Math.abs(target - current) > 0.0005) {
      const next = current + (target - current) * smoothing;
      plane.scale.setScalar(next);
    }
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

<script>
/* Minimal dependency-free starfield: slow independent twinkle per star. */
(() => {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let stars = [];
  let comets = [];
  let nextCometAt = 0;
  let rockets = [];
  let nextRocketAt = 9000;

  function spawnComet(t) {
    const fromLeft = Math.random() < 0.5;
    const angle = fromLeft ? Math.random() * 0.3 + 0.15 : Math.PI - (Math.random() * 0.3 + 0.15);
    const speed = (Math.random() * 6 + 9) * dpr;
    comets.push({
      x: fromLeft ? -40 : canvas.width + 40,
      y: Math.random() * canvas.height * 0.5,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      trail: [],
    });
    // noticeably busier sky — a shooting star every second or two instead
    // of every several seconds, and often more than one on screen at once
    nextCometAt = t + 900 + Math.random() * 1800;
  }

  /* a rare, silly easter egg — a tiny rocket coasting across the upper
     sky. Not a likeness of anyone real (emoji only, no portrait), just a
     wink at "a rocket passing by." Spawns roughly every couple of minutes,
     rare enough to be a nice surprise rather than a distraction. */
  function spawnRocket(t) {
    const fromLeft = Math.random() < 0.5;
    const dir = fromLeft ? 1 : -1;
    const speed = (Math.random() * 2 + 3.5) * dpr;
    rockets.push({
      x: fromLeft ? -60 * dpr : canvas.width + 60 * dpr,
      y: canvas.height * (0.1 + Math.random() * 0.3),
      vx: dir * speed,
      vy: -speed * 0.22,
      dir,
      trail: [],
    });
    nextRocketAt = t + 70000 + Math.random() * 60000;
  }

  /* Real starlight varies by temperature — mostly white, with a minority
     of cool blue-white, cyan and warm amber stars for a touch of color
     without tinting the field as a whole. */
  const STAR_COLORS = [
    [255, 255, 255], [255, 255, 255], [255, 255, 255], [255, 255, 255],
    [190, 220, 255], [189, 238, 255], [255, 214, 170],
  ];

  function resize() {
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    const count = Math.round((innerWidth * innerHeight) / 1100);
    stars = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: (i % 9 === 0 ? Math.random() * 1.8 + 2.2 : Math.random() * 1.3 + 0.9) * dpr,
      base: Math.random() * 0.4 + 0.6,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.5 + 0.15,
      // a hair of downward parallax drift per star, wrapping at the bottom —
      // slow enough to read as "distant motion," not a falling-star effect
      drift: (Math.random() * 0.5 + 0.15) * dpr,
      color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
    }));
  }

  let lastStarT = 0;
  function frame(t) {
    const dt = lastStarT ? Math.min((t - lastStarT) / 1000, 0.05) : 0;
    lastStarT = t;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.y += s.drift * dt;
      if (s.y > canvas.height) s.y -= canvas.height;
      const a = Math.min(1, s.base * (0.65 + 0.35 * Math.sin(t * 0.0012 * s.speed + s.phase)));
      const big = s.r > 1.6 * dpr;
      const [r, g, b] = s.color;
      ctx.shadowBlur = big ? s.r * 4 : 0;
      ctx.shadowColor = `rgba(${r},${g},${b},${a.toFixed(3)})`;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${r},${g},${b},${a.toFixed(3)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    /* occasional shooting star — a tasteful once-every-several-seconds
       accent, not a constant effect */
    if (t > nextCometAt) spawnComet(t);
    ctx.shadowBlur = 0;
    comets.forEach((c) => {
      c.trail.push({ x: c.x, y: c.y });
      if (c.trail.length > 14) c.trail.shift();
      c.x += c.vx;
      c.y += c.vy;
      c.life -= 0.012;
      const n = c.trail.length;
      c.trail.forEach((p, i) => {
        const a = (i / n) * c.life * 0.85;
        ctx.beginPath();
        ctx.fillStyle = `rgba(214,232,255,${a.toFixed(3)})`;
        ctx.arc(p.x, p.y, 1.5 * dpr * (i / n), 0, Math.PI * 2);
        ctx.fill();
      });
    });
    comets = comets.filter((c) => c.life > 0 && c.x > -80 && c.x < canvas.width + 80 && c.y < canvas.height + 80);

    if (t > nextRocketAt) spawnRocket(t);
    rockets.forEach((rk) => {
      rk.trail.push({ x: rk.x, y: rk.y });
      if (rk.trail.length > 20) rk.trail.shift();
      rk.x += rk.vx;
      rk.y += rk.vy;
      const n = rk.trail.length;
      rk.trail.forEach((p, i) => {
        const a = (i / n) * 0.55;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 176, 120, ${a.toFixed(3)})`;
        ctx.arc(p.x, p.y, 2.4 * dpr * (i / n), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.save();
      ctx.translate(rk.x, rk.y);
      if (rk.dir < 0) ctx.scale(-1, 1); // mirror so it still points the way it's flying
      ctx.font = (26 * dpr) + 'px -apple-system, "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚀', 0, 0);
      ctx.restore();
    });
    rockets = rockets.filter((rk) => rk.x > -100 * dpr && rk.x < canvas.width + 100 * dpr);

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
